name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ApexStickTrainerNative_v0.2_GitHubReady.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          unzip -q ApexStickTrainerNative_v0.2_GitHubReady.zip -d srcpkg
          cd srcpkg/ApexStickTrainerNative_v0.2
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../ApexStickTrainer-v0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ApexStickTrainer-v0.2-apk
          path: ApexStickTrainer-v0.2.apk
