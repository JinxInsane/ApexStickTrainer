name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ApexStickTrainerNative_v0.2_GitHubReady.zip'
      - 'patch/v0.21/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build crash-safe APK
        run: |
          rm -rf srcpkg
          mkdir srcpkg
          unzip -q ApexStickTrainerNative_v0.2_GitHubReady.zip -d srcpkg
          APPDIR="srcpkg/ApexStickTrainerNative_v0.2"
          PKG="$APPDIR/app/src/main/java/com/openai/apexsticktrainer"
          cp patch/v0.21/AimCanvasView.java "$PKG/AimCanvasView.java"
          cp patch/v0.21/MainActivity.java "$PKG/MainActivity.java"
          cd "$APPDIR"
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../ApexStickTrainer-v0.2.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ApexStickTrainer-v0.2.1-apk
          path: ApexStickTrainer-v0.2.1.apk
