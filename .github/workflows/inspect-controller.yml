name: Inspect ControllerInput
on:
  push:
    paths:
      - '.github/workflows/inspect-controller.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print ControllerInput
        run: |
          mkdir inspectsrc
          unzip -q ApexStickTrainerNative_v0.2_GitHubReady.zip -d inspectsrc
          PKG="inspectsrc/ApexStickTrainerNative_v0.2/app/src/main/java/com/openai/apexsticktrainer"
          echo "===== ControllerInput.java ====="
          cat "$PKG/ControllerInput.java"
